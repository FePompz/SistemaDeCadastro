<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes - CRUD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    
    <header class="main-header">
      <h1>Gerenciamento de Clientes</h1>
    </header>

    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Cadastrar Novo Cliente</h2>
      
      <form id="client-form">
        <fieldset>
          <legend class="sr-only">Dados do Cliente</legend>
          
          <div class="input-group">
            <label for="name">Nome:</label>
            <input type="text" id="name" placeholder="Ex: Maria Silva" required>
          </div>

          <div class="input-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Ex: maria@email.com" required>
          </div>
        </fieldset>

        <button type="submit" id="btn-submit">Salvar Cliente</button>
      </form>
    </section>

    <section class="list-section" aria-labelledby="list-heading">
      <h2 id="list-heading">Clientes Cadastrados</h2>
      
      <ul id="clients-list">
      </ul>
    </section>

  </main>

  <footer class="main-footer">
    <p>Projeto de estudo: Consumo de API REST via Fetch API.</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
